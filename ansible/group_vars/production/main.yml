---
# servers
data_server: fls-p10k-u1.nhm.ac.uk
app_servers:
  - app-p10k-u1.nhm.ac.uk
  - app-p10k-u2.nhm.ac.uk
lb_servers:
  - nlb-p10k-u1.nhm.ac.uk
  - nlb-p10k-u2.nhm.ac.uk
server_ips: "{{ lookup('hashi_vault', 'secret=phenome10k/p10k:server_ips')}}"

# folders
nfs_path: /data
thumbnail_dir: '{{ p10k_src_dir }}/thumbnails'

# firewall
trusted_networks:
  - 157.140.0.0/16
  - 127.0.0.0/16

# keepalived
virtual_ip: 157.140.2.224
vrrp_interface: ens160
vrrp_password: "{{ lookup('hashi_vault', 'secret=phenome10k/vrrp:password')}}"

# monit
mmonit_admin_password: "{{ lookup('hashi_vault', 'secret=phenome10k/mmonit:password')}}"
monit_hostname: monit.phenome10k.org

# database
mysql_root_password: "{{ lookup('hashi_vault', 'secret=phenome10k/mysql:root_password')}}"
p10k_db_password: "{{ lookup('hashi_vault', 'secret=phenome10k/mysql:p10k_password')}}"
p10k_db_url: mysql+pymysql://{{ p10k_db_user }}:{{ p10k_db_password | urlencode |
  replace('/','%2F') }}@{{ p10k_db_host }}:3306/{{ p10k_db_name }}
mysql_monit:
  user_name: monit
  password: "{{ lookup('hashi_vault', 'secret=phenome10k/mysql:monit_password')}}"

# nginx
use_ssl: true
hostname: phenome10k.org

# p10k: flask
flask_secret_key: "{{ lookup('hashi_vault', 'secret=phenome10k/p10k:flask_secret')}}"
p10k_admin_password: "{{ lookup('hashi_vault', 'secret=phenome10k/p10k:admin_password')}}"
password_salt: "{{ lookup('hashi_vault', 'secret=phenome10k/p10k:password_salt')}}"

# p10k: mail
mail_host: mta-smtprelay-2.nhm.ac.uk

# p10k: setup
skip_git_checkout: false

# cloudflare
cloudflare_token: "{{ lookup('hashi_vault', 'secret=phenome10k/cloudflare:token') }}"
